    <!-- GitHub Pages SPA routing fix -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
        
        // Eski 'Deneme-bolgesi' uzantılı Google linklerini yeni domaine (kök dizine) yönlendir
        if (window.location.pathname.includes('/Deneme-bolgesi')) {
          var newPath = window.location.pathname.replace('/Deneme-bolgesi', '');
          if (newPath === '') newPath = '/';
          window.history.replaceState(null, null, newPath + window.location.search + window.location.hash);
        }
      }(window.location))
    </script>
